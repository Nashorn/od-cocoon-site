# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: od-cocoon-site
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:site
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: redirect
        source: /__old_index.html
        destination: /
